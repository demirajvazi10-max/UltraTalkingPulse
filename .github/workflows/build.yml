# Builds UltraTalkingPulse on every push and pull request to main.
# A tag that starts with "v" (for example v1.0.0, made in GitHub Desktop) also publishes a
# GitHub release with the installable APK.
#
# Presage OAuth: the app signs in to Presage with presage_services.xml and the signing key
# registered for it. Neither is in git, so the workflow gets them from two repository secrets:
#   PRESAGE_SERVICES_XML   - the text of app/src/main/res/xml/presage_services.xml
#   DEBUG_KEYSTORE_BASE64  - the debug keystore (base64) whose SHA-256 is registered with Presage
# pripremi-github-tajne.cmd copies both to the clipboard, one at a time.
# Without the secrets the APK still builds, but it cannot sign in to Presage.
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    # Ubuntu 24.04 comes with the Android SDK already installed (ANDROID_HOME)
    runs-on: ubuntu-24.04

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Work out the version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; label="${GITHUB_REF_NAME}"; else v="1.0.${{ github.run_number }}"; label="build-${{ github.run_number }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "apk=UltraTalkingPulse-$label-android.apk" >> "$GITHUB_OUTPUT"

      - name: Add the Presage sign-in files
        shell: bash
        env:
          PRESAGE_SERVICES_XML: ${{ secrets.PRESAGE_SERVICES_XML }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PRESAGE_SERVICES_XML" ]; then
            mkdir -p app/src/main/res/xml
            printf '%s' "$PRESAGE_SERVICES_XML" > app/src/main/res/xml/presage_services.xml
            echo "presage_services.xml added"
          else
            echo "::warning::PRESAGE_SERVICES_XML secret is missing - this APK will not be able to sign in to Presage"
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > ~/.android/debug.keystore
            echo "debug keystore added"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is missing - the APK is signed with a different key than the one registered with Presage"
          fi

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PappVersion=${{ steps.ver.outputs.version }} -PappVersionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/*.apk "${{ steps.ver.outputs.apk }}"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: UltraTalkingPulse-android
          path: ${{ steps.ver.outputs.apk }}

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ver.outputs.apk }}
          generate_release_notes: true
